[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dispatcher"
version = "0.1.0"
description = "Lead, worker and verifier agent orchestration demo with a deterministic mock model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
agent-dispatcher = "agent_dispatcher.cli:main"

[tool.setuptools.packages.find]
include = ["agent_dispatcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
